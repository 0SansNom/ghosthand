[project]
name = "ghosthand"
version = "0.1.0"
description = "Natural-language automation for iOS Simulators and iPhones"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "pillow>=13.0.0",
    "typer>=0.12",
]

[project.scripts]
ghosthand = "ghosthand.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghosthand"]
